<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>PostgreSQL to Data Lakehouse</title>
<style>
:root { color-scheme: dark; font: 24px/1.42 "Inter", sans-serif; background: #0b131f; color: #f2f6fc }
* { box-sizing: border-box }
body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(ellipse at top right,#16364a,transparent 55%), #0b131f }
header,main,footer { margin-left: 104px; margin-right: 104px }
header { display:flex; justify-content:space-between; align-items:center; padding-top:54px; padding-bottom:22px; border-bottom:1px solid #314456; font-weight:650; color:#bccbd9 }
header span:last-child { color:#62e1c8 }
main { padding-top:34px }
h1 { margin:0; font-weight:760; font-size:67px; letter-spacing:-.045em; line-height:1.1 }
.hero h1 { font-size:104px; max-width:1450px }
h2 { margin:12px 0 26px; font-size:30px; color:#c4d6e8; font-weight:450 }
img { display:block; width:1570px; max-height:475px; margin:12px auto 0 }
.hero img { max-height:440px }
pre { margin:0; padding:20px 30px; background:#0c1725; border:1px solid #2d465c; border-radius:14px; box-shadow:0 18px 72px #02070f55; color:#ecf4ff; white-space:pre-wrap; overflow-wrap:anywhere; tab-size:4; font: 24px/1.38 "JetBrains Mono","DejaVu Sans Mono",monospace; max-height:579px; overflow:hidden }
mark { background:#225a50; color:#f7fffd; border-radius:4px }
footer { position:absolute; left:0; right:0; bottom:40px; min-height:108px; display:grid; place-items:center; padding:10px 29px; border-radius:12px; background:#122538; border:1px solid #2a465d; text-align:center; font:26px/1.6 "Noto Sans Khmer","Inter",sans-serif; color:#f2f7fc }
[hidden]{ display:none!important }
</style>
<header><span>PostgreSQL to Data Lakehouse</span><span id="section">Flow 1</span></header>
<main id="content">
  <h1 id="title"></h1><h2 id="subtitle"></h2>
  <img id="diagram" hidden src="/architecture.svg" alt="PostgreSQL to Databricks architecture">
  <pre id="detail" hidden></pre>
</main>
<footer id="caption" lang="km" hidden></footer>
<script>
const number = new URLSearchParams(location.search).get("scene");
const byId = id => document.getElementById(id);
let previous = "";
async function refresh() {
  try {
    const response = await fetch("/view/" + number, {cache:"no-store"});
    const raw = await response.text();
    if (raw === previous) return;
    previous = raw;
    const state = JSON.parse(raw);
    for (const key of ["section","title","subtitle","caption"]) byId(key).textContent = state[key] || "";
    byId("content").classList.toggle("hero", Boolean(state.hero));
    byId("diagram").hidden = !state.diagram;
    byId("detail").hidden = !state.detail;
    byId("caption").hidden = !state.caption;
    const lines = (state.detail || "").split("\n");
    const content = [];
    lines.forEach((line, index) => {
      if (index) content.push(document.createTextNode("\n"));
      if ((state.highlight || []).some(fragment => line.includes(fragment))) {
        const mark = document.createElement("mark");
        mark.textContent = line;
        content.push(mark);
      } else content.push(document.createTextNode(line));
    });
    byId("detail").replaceChildren(...content);
  } catch (_) {}
}
refresh();
setInterval(refresh, 120);
</script>
</html>
